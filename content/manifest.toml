# The demo atlas, laid out the way Mellangan's atlas is. Bake with:  uv run doteshi bake
#
# Rules it follows:
#   - Every sprite is 16x16. A big structure may be 32x32 or larger, as long as it is a whole number of
#     16-pixel cells each way; it is cut into cells and stored as a block of them.
#   - Living things face south and glance to the south-south-east. The game mirrors them.

[atlas]
name = "atlas"
layout = "grid"
cell = 16                 # sprite size
gutter = 1                # transparent border inside each 18-pixel cell
columns = 24
namespace = "atlas::gen"
content = "demo"

[[sprite]]
id = "slime"
variants = 12
pivot = "bottom"

[[sprite]]
id = "beetle"
variants = 12
pivot = "center"

[[sprite]]
id = "mushroom"
variants = 12
pivot = "bottom"

[[sprite]]
id = "flower"
variants = 12
pivot = "bottom"

[[sprite]]
id = "gem"
variants = 12
pivot = "center"

# A big structure: 32x32, stored as a 2x2 block of cells.
[[sprite]]
id = "tree"
size = 32
variants = 12
pivot = "bottom"
