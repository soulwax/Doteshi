# The demo atlas: the two M1 subjects at mixed sizes.
# Bake with:  uv run sprites bake

[atlas]
name = "atlas"
layout = "packed"
padding = 2
max_size = 2048
namespace = "atlas::gen"
content = "demo"

[[sprite]]
id = "mushroom"
sizes = [128, 64]
variants = 8
pivot = "bottom"

[[sprite]]
id = "mushroom"
size = 256
seeds = [11, 16]
pivot = "bottom"

[[sprite]]
id = "beetle"
sizes = [128, 64]
variants = 8
pivot = "center"

[[sprite]]
id = "beetle"
size = 256
seeds = [3, 13]
pivot = "center"

# Small sizes go through the pixel resolver: pixel-hd at 32px, tiny at 16px.
[[sprite]]
id = "mushroom"
sizes = [32, 16]
variants = 8
pivot = "bottom"

[[sprite]]
id = "beetle"
sizes = [32, 16]
variants = 8
pivot = "center"

# The 16px gem is a hand-drawn cell (see demo/gem.py); the 64px one is generated.
[[sprite]]
id = "gem"
sizes = [64, 16]
variants = 6
pivot = "center"
