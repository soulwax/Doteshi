# The demo atlas. Bake with:  uv run doteshi bake
#
# The focus is 16 to 64 pixels: 16px sprites use the "tiny" profile, 32 to 64px use "pixel-hd".
# A few large painted sprites show that the same definitions scale up.

[atlas]
name = "atlas"
layout = "packed"
padding = 2
max_size = 2048
namespace = "atlas::gen"
content = "demo"

[[sprite]]
id = "mushroom"
sizes = [16, 32, 48, 64]
variants = 6
pivot = "bottom"

[[sprite]]
id = "beetle"
sizes = [16, 32, 48, 64]
variants = 6
pivot = "center"

[[sprite]]
id = "tree"
sizes = [16, 32, 48, 64]
variants = 6
pivot = "bottom"

[[sprite]]
id = "flower"
sizes = [16, 32, 48, 64]
variants = 6
pivot = "bottom"

# The 16px gem is a hand-drawn cell (see demo/gem.py); larger sizes are generated.
[[sprite]]
id = "gem"
sizes = [16, 32, 48, 64]
variants = 6
pivot = "center"

[[sprite]]
id = "mushroom"
size = 128
seeds = [11, 16]
pivot = "bottom"

[[sprite]]
id = "beetle"
size = 128
seeds = [3, 13]
pivot = "center"

[[sprite]]
id = "tree"
size = 128
seeds = [1, 5]
pivot = "bottom"

[[sprite]]
id = "flower"
size = 128
seeds = [3, 6]
pivot = "bottom"
