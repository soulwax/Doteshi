[project]
name = "procsprites"
version = "0.1.0"
description = "Procedural sprites of any size and kind, baked into an atlas"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "pillow>=11"]

[project.scripts]
sprites = "procsprites.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procsprites"]

[tool.pytest.ini_options]
testpaths = ["tests"]
